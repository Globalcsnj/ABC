<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart – ABC MoneyLoan</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="shop-body">
    <header class="shop-topbar">
        <a href="/shop" class="shop-logo"><img src="/static/media/logo.png" class="brand-logo" onerror="this.onerror=null;this.src='/static/media/logo.svg'" alt="ABC MoneyLoan"></a>
        <div style="flex:1"></div>
        <a href="/shop/cart" class="shop-cart-link">🛒 <span id="cartCount" class="cart-badge">0</span></a>
    </header>

    <div class="cart-page">
        <h1>Your Cart</h1>
        <div id="cartEmpty" class="shop-empty" style="display:none">
            Your cart is empty. <a href="/shop">Browse the shop →</a>
        </div>

        <div id="cartContent" style="display:none">
            <div id="cartItems" class="cart-items"></div>

            <div class="cart-checkout card">
                <h2>Request a Hold</h2>
                <p class="card-subtitle">Leave your name and phone — staff will set these items aside and call you.</p>
                <form id="holdForm">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" name="customer_name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Email (optional — we'll send your hold details)</label>
                        <input type="email" name="email">
                    </div>
                    <button type="submit" class="btn btn-primary">Request Hold</button>
                </form>
                <div id="holdResult" class="import-result"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/shop.js"></script>
    <script>renderCart();</script>
</body>
</html>
