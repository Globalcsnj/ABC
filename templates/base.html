<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ABC Pawnshop Inventory{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">🏪 ABC MoneyLoan Pawnshop</a>
        <div class="nav-links">
            <a href="/">Home</a>

            <div class="nav-group">
                <button class="nav-group-btn">Inventory ▾</button>
                <div class="nav-menu">
                    <a href="/inventory">All Items</a>
                    <a href="/analysis">Inventory Analysis</a>
                    <a href="/new-count">Start a Count</a>
                    <a href="/reconcile">Sold / Reconcile</a>
                </div>
            </div>

            <div class="nav-group">
                <button class="nav-group-btn">Store &amp; Sales ▾</button>
                <div class="nav-menu">
                    <a href="/dashboard">Sales Dashboard</a>
                    <a href="/inquiries">Hold Requests</a>
                    <a href="/welcome" target="_blank">Landing Page ↗</a>
                    <a href="/shop" target="_blank">Customer Shop ↗</a>
                </div>
            </div>

            <div class="nav-group">
                <button class="nav-group-btn">Setup ▾</button>
                <div class="nav-menu">
                    <a href="/locations">Locations &amp; Labels</a>
                    <a href="/stores">Stores</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/camera.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
