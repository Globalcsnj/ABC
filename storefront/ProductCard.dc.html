<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ item.open }}" style="position:relative; display:flex; flex-direction:column; background:#fff; border:1px solid #e6e0d3; border-radius:16px; overflow:hidden; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;" style-hover="transform:translateY(-4px); box-shadow:0 16px 38px rgba(14,26,43,.15); border-color:#d8c89a;">
  <!-- IMAGE -->
  <div style="position:relative; aspect-ratio:1/1; overflow:hidden;">
    <sc-if value="{{ item.isJewelry }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; background:radial-gradient(120% 120% at 30% 25%,#fbf1d6,#e6c988 55%,#b98f3c);"></div>
    </sc-if>
    <sc-if value="{{ item.notJewelry }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; inset:0; background:radial-gradient(120% 120% at 30% 25%,#33475e,#1b2c3f 60%,#0f1c2b);"></div>
      <div style="position:absolute; inset:0; opacity:.4; background-image:linear-gradient(rgba(255,255,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.06) 1px,transparent 1px); background-size:26px 26px;"></div>
    </sc-if>
    <sc-if value="{{ item.noImage }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <span style="font-family:'Cormorant Garamond',serif; font-size:52px; font-weight:700; color:{{ item.thumbInk }}; line-height:1;">{{ item.mono }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ item.hasImage }}" hint-placeholder-val="{{ false }}">
      {{ item.imgEl }}
    </sc-if>
    <sc-if value="{{ item.oneOfKind }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute; top:10px; left:10px; display:inline-flex; align-items:center; gap:5px; background:rgba(11,20,33,0.88); color:#E8C06A; font-size:10.5px; font-weight:800; letter-spacing:.6px; padding:4px 9px; border-radius:14px;">✦ ONE OF A KIND</span>
    </sc-if>
  </div>
  <!-- BODY -->
  <div style="padding:14px 15px 15px; display:flex; flex-direction:column; flex:1;">
    <div style="color:#B07E22; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;">{{ item.cat }}</div>
    <div style="font-weight:700; font-size:15.5px; color:#0E1A2B; line-height:1.25; margin:4px 0 10px; text-wrap:pretty;">{{ item.title }}</div>
    <div style="display:flex; align-items:center; gap:7px; margin-bottom:12px;">
      <span style="width:7px; height:7px; border-radius:50%; background:#1F9D5B;"></span>
      <span style="color:#127a45; font-size:12px; font-weight:700;">Available · {{ item.cond }}</span>
    </div>
    <div style="margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <sc-if value="{{ item.hasPrice }}" hint-placeholder-val="{{ true }}"><span style="font-size:21px; font-weight:800; color:#A4262C; letter-spacing:-.5px;">{{ item.priceLabel }}</span></sc-if>
      <sc-if value="{{ item.askPrice }}" hint-placeholder-val="{{ false }}"><span style="font-size:15px; font-weight:800; color:#0E1A2B;">Ask in store</span></sc-if>
      <button onClick="{{ item.add }}" title="Add to cart" style="flex-shrink:0; display:flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:11px; background:linear-gradient(145deg,#E8C06A,#B07E22); border:none; cursor:pointer; box-shadow:0 4px 12px rgba(192,138,45,.3);" style-hover="filter:brightness(1.06);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1a1205" stroke-width="2.4"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M6 6L5 3H2"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:360},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}"></script>
</body>
</html>
